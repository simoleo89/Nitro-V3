name: Safe Sync - Nitro-V3

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: safe-sync
  cancel-in-progress: false

jobs:
  sync-safe:
    runs-on: ubuntu-latest

    # Serve al GITHUB_TOKEN standard, ma il push sarà autenticato
    # principalmente tramite il PAT SYNC_TOKEN.
    permissions:
      contents: write

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Merge Upstream
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_URL="https://github.com/duckietm/Nitro-V3.git"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "$UPSTREAM_URL"
          else
            git remote add upstream "$UPSTREAM_URL"
          fi

          git fetch origin --prune
          git fetch upstream --prune

          while IFS= read -r upstream_ref; do
            local_branch="${upstream_ref#refs/remotes/upstream/}"

            echo "::group::$local_branch"

            # Cerca prima il branch nel fork.
            if git show-ref --verify --quiet \
              "refs/remotes/origin/$local_branch"; then

              git checkout -B "$local_branch" "origin/$local_branch"
              git branch --set-upstream-to="origin/$local_branch" \
                "$local_branch" >/dev/null 2>&1 || true

            else
              # Il branch esiste solo nell'upstream:
              # viene creato localmente e successivamente pubblicato nel fork.
              git checkout -B "$local_branch" \
                "upstream/$local_branch"
            fi

            upstream_sha="$(git rev-parse "upstream/$local_branch")"

            if git merge-base --is-ancestor "$upstream_sha" HEAD; then
              echo "Nessun aggiornamento upstream per $local_branch."

              # Pubblica comunque il branch se non esiste ancora nel fork.
              if ! git show-ref --verify --quiet \
                "refs/remotes/origin/$local_branch"; then
                echo "Branch assente nel fork: lo pubblico."
                git push --set-upstream origin "$local_branch"
              fi

              echo "::endgroup::"
              continue
            fi

            echo "Aggiornamenti rilevati su $local_branch."

            if git merge --no-edit "upstream/$local_branch"; then
              echo "Merge completato. Push di $local_branch..."
              git push --set-upstream origin "$local_branch"
            else
              echo "::warning::Conflitto su $local_branch. Merge annullato; nessun push eseguito."
              git merge --abort
            fi

            echo "::endgroup::"
          done < <(
            git for-each-ref \
              --format='%(refname)' \
              'refs/remotes/upstream/*' |
            grep -v '/HEAD$'
          )